[project]
name = "rigel"
version = "0.1.0"
description = "Rigel: caption quality scorer for videos and images (inference)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers>=4.37.0,<5.0.0",
    "peft>=0.16.0,<0.17.0",
    "accelerate>=1.8.1,<2.0.0",
    "omegaconf>=2.1,<3.0",
    "numpy<2",
    "scipy>=1.13.1,<2.0.0",
    "pandas>=2.3.1,<3.0.0",
    "pillow>=11.3.0,<12.0.0",
    "av>=16.0.1,<17.0.0",
    "tqdm>=4.66",
    "qwen-vl-utils[decord]>=0.0.14,<0.0.15",
    "huggingface-hub>=0.30,<1.0",
    "safetensors>=0.4",
]

[project.scripts]
rigel-score = "rigel.cli:main"

[project.optional-dependencies]
flash_attn = [
    "flash-attn>=2.6,<3.0"
]
dev = [
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigel"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
